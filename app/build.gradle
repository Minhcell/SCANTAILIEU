plugins { id 'com.android.application' }
android {
    namespace 'vn.hi.quettailieu'
    compileSdk 34
    defaultConfig {
        applicationId 'vn.hi.quettailieu'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '2.1'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
